[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-healing-sql-backend"
version = "0.1.0"
description = "Backend service for Self-Healing Text-to-SQL Analytics Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "sqlglot>=25.30.0",
    "cryptography>=43.0.3",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-groq>=0.2.1",
    "langgraph>=0.2.45",
    "psycopg[binary]>=3.2.0",
    "pg8000>=1.31.0",
    "pymysql>=1.1.1",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:langsmith_plugin"
filterwarnings = [
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::DeprecationWarning:uuid_utils.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
